<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>鹈鹕骑自行车</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #d8f3ff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .scene {
        width: min(100vw, 1100px);
        aspect-ratio: 16 / 9;
        filter: drop-shadow(0 20px 28px rgb(32 67 87 / 16%));
      }
      svg { display: block; width: 100%; height: 100%; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.4s linear infinite; }
      .pedals { transform-box: fill-box; transform-origin: center; animation: spin 1.4s linear infinite reverse; }
      .bike-bounce { animation: bounce .7s ease-in-out infinite alternate; }
      .wing { transform-box: fill-box; transform-origin: 80% 80%; animation: flap .8s ease-in-out infinite alternate; }
      .wing-back { animation-delay: -.2s; }
      .leg-front { transform-box: fill-box; transform-origin: 50% 0; animation: pedal-front 1.4s linear infinite; }
      .leg-back { transform-box: fill-box; transform-origin: 50% 0; animation: pedal-back 1.4s linear infinite; }
      .cloud { animation: drift 18s linear infinite; }
      .cloud.two { animation-duration: 25s; animation-delay: -9s; }
      .bird-shadow { animation: shadow .7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-5px); } }
      @keyframes flap { from { transform: rotate(3deg); } to { transform: rotate(-16deg); } }
      @keyframes pedal-front { to { transform: rotate(360deg); } }
      @keyframes pedal-back { to { transform: rotate(-360deg); } }
      @keyframes drift { from { transform: translateX(-80px); } to { transform: translateX(1080px); } }
      @keyframes shadow { from { transform: scaleX(1); opacity: .22; } to { transform: scaleX(.82); opacity: .13; } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>
  <body>
    <main class="scene" aria-label="一只鹈鹕骑着自行车穿过海边小路的动画">
      <svg viewBox="0 0 1100 620" role="img" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#8bdcf2" />
            <stop offset="1" stop-color="#f3fbda" />
          </linearGradient>
          <linearGradient id="road" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#7eaa9c" />
            <stop offset="1" stop-color="#3d6f6f" />
          </linearGradient>
          <linearGradient id="body" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#fffdf3" />
            <stop offset="1" stop-color="#d9e9df" />
          </linearGradient>
          <linearGradient id="beak" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#f7c05c" />
            <stop offset="1" stop-color="#e47c45" />
          </linearGradient>
        </defs>

        <rect width="1100" height="620" fill="url(#sky)" />
        <circle cx="900" cy="116" r="57" fill="#ffe48a" opacity=".95" />
        <circle cx="900" cy="116" r="76" fill="#ffe48a" opacity=".18" />

        <g class="cloud" fill="#fff" opacity=".72">
          <path d="M60 142c9-27 37-36 58-17 13-36 67-35 77 8 30-14 61 5 60 34H60c-15-5-17-15 0-25Z" />
        </g>
        <g class="cloud two" fill="#fff" opacity=".56">
          <path d="M745 190c8-23 31-31 49-15 13-31 55-29 64 7 25-12 51 5 50 29H745c-13-5-14-13 0-21Z" />
        </g>

        <path d="M0 340C150 275 260 328 385 291c142-43 230 33 366-12 137-45 237-5 349-43v164H0Z" fill="#82c5a2" />
        <path d="M0 383c146-32 240 11 363-25 142-42 217 35 355-2 145-39 253-4 382-47v145H0Z" fill="#5da78b" />
        <path d="M0 437c159-30 287 11 432-15 159-28 264 21 365-8 110-31 206-8 303-31v237H0Z" fill="url(#road)" />
        <path d="M0 492c176-26 308 8 456-8 184-20 286 16 410-10 102-22 168-9 234-20v166H0Z" fill="#345d61" opacity=".42" />
        <g fill="#e9d994" opacity=".9">
          <path d="M40 536h105l-18 10H22Z" /><path d="M280 514h120l-24 11H258Z" />
          <path d="M555 535h132l-24 11H530Z" /><path d="M840 514h116l-21 11H817Z" />
        </g>
        <g fill="#f5cf72">
          <path d="M84 399c14-22 33-25 45 0-17-8-30-5-45 0Z" /><path d="M950 380c11-20 29-23 40 0-14-8-26-5-40 0Z" />
        </g>

        <ellipse class="bird-shadow" cx="555" cy="509" rx="187" ry="17" fill="#172f38" />

        <g class="bike-bounce">
          <!-- bicycle -->
          <g fill="none" stroke="#253f51" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
            <g class="wheel"><circle cx="414" cy="462" r="79" stroke="#edf4e7" stroke-width="7" /><circle cx="414" cy="462" r="6" fill="#253f51" stroke="none" /><path d="M414 389v146M341 462h146M362 410l104 104M466 410L362 514" stroke="#d7e6df" stroke-width="3" /></g>
            <g class="wheel"><circle cx="696" cy="462" r="79" stroke="#edf4e7" stroke-width="7" /><circle cx="696" cy="462" r="6" fill="#253f51" stroke="none" /><path d="M696 389v146M623 462h146M644 410l104 104M748 410L644 514" stroke="#d7e6df" stroke-width="3" /></g>
            <path d="M414 462 495 381l80 81-161 0 80-81 53-81" />
            <path d="M575 462 696 462M575 462 541 365" />
            <path d="M495 381h-35M541 365l24-15" />
          </g>
          <g class="pedals" fill="none" stroke="#f0bb52" stroke-width="6" stroke-linecap="round">
            <circle cx="495" cy="381" r="15" /><path d="M495 381l-23-20M495 381l23 20" />
          </g>

          <!-- pelican -->
          <g>
            <path d="M475 329c-12-61 16-107 72-122 52-14 107 16 117 71 9 47-24 88-77 98-45 9-101-5-112-47Z" fill="url(#body)" stroke="#344c55" stroke-width="6" />
            <path class="wing wing-back" d="M548 284c-47-49-101-31-105 6-3 29 27 55 70 57 26 2 51-17 35-63Z" fill="#c4ded5" stroke="#344c55" stroke-width="6" />
            <path class="wing" d="M606 283c51-55 92-32 88 5-3 31-37 59-77 54-23-3-32-27-11-59Z" fill="#d9eee0" stroke="#344c55" stroke-width="6" />
            <path d="M530 211c-11-58 21-102 72-102 48 0 76 38 65 82-7 28-28 48-58 55-40 9-70-5-79-35Z" fill="#fffdf3" stroke="#344c55" stroke-width="6" />
            <path d="M656 180c42-10 86 4 129 35-40 22-86 28-130 6Z" fill="url(#beak)" stroke="#344c55" stroke-width="6" />
            <path d="M658 202c51 1 87 4 127 13-42 16-83 18-126 6Z" fill="#ef9b53" opacity=".65" />
            <circle cx="640" cy="156" r="8" fill="#344c55" /><circle cx="643" cy="153" r="3" fill="#fff" />
            <path d="M579 110c-2-19 9-33 25-39 14 14 17 32 8 48Z" fill="#e6a449" stroke="#344c55" stroke-width="5" />
            <path d="M570 325c-4 33-10 57-20 71M617 323c-2 29 2 55 16 73" fill="none" stroke="#344c55" stroke-width="8" stroke-linecap="round" />
            <g class="leg-front"><path d="M550 378l-31 8" fill="none" stroke="#e6a449" stroke-width="8" stroke-linecap="round" /><path d="M519 386h-24" fill="none" stroke="#344c55" stroke-width="7" stroke-linecap="round" /></g>
            <g class="leg-back"><path d="M633 396l-20-16" fill="none" stroke="#e6a449" stroke-width="8" stroke-linecap="round" /><path d="M613 380h-22" fill="none" stroke="#344c55" stroke-width="7" stroke-linecap="round" /></g>
            <path d="M521 255c22 16 48 19 72 8" fill="none" stroke="#b3cbc4" stroke-width="5" stroke-linecap="round" />
          </g>
        </g>

        <g fill="#f8e08b" opacity=".8">
          <circle cx="163" cy="294" r="5" /><circle cx="184" cy="278" r="3" /><circle cx="946" cy="286" r="5" /><circle cx="975" cy="305" r="3" />
        </g>
        <text x="56" y="574" fill="#e8f4df" font-size="18" letter-spacing="4">PELICAN RIDE</text>
      </svg>
    </main>
  </body>
</html>
